# ai-dev-kit — package CI gate.
#
# Runs `aidev check` on every pull request of a package that uses ai-dev-kit.
# This is the enforcement that sits outside the AI: the deny list and the
# runtime guard can be edited away locally, but the diff that disables them is
# itself something this pipeline is required to approve.
#
# Set this as a REQUIRED build-validation policy on the package's default
# branch. Without that, a hand-edited `.claude/**` merges cleanly and the whole
# integrity model is advisory.
#
# The CLI is not part of the package; the pipeline clones the central kit and
# runs it from there. Pin AIDEV_KIT_REF to a tag or commit when you want every
# build to use the same kit version.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  - name: NODE_VERSION
    value: '20.x'
  - name: AIDEV_KIT_URL
    value: 'https://dev.azure.com/<org>/<project>/_git/ai-dev-kit'
  - name: AIDEV_KIT_REF
    value: 'main'

steps:
  - checkout: self
    fetchDepth: 0

  - task: NodeTool@0
    displayName: 'Use Node $(NODE_VERSION)'
    inputs:
      versionSpec: $(NODE_VERSION)

  - script: |
      set -euo pipefail
      git clone --quiet --depth 1 --branch "$(AIDEV_KIT_REF)" "$(AIDEV_KIT_URL)" "$(Pipeline.Workspace)/ai-dev-kit"
      node "$(Pipeline.Workspace)/ai-dev-kit/cli/bin/aidev.js" --version
    displayName: 'Get ai-dev-kit'

  # Runtime, tooling and connectivity. Advisory: doctor reports environment
  # facts (a missing token, a proxy) that are not the PR author's fault.
  - script: |
      set -euo pipefail
      node "$(Pipeline.Workspace)/ai-dev-kit/cli/bin/aidev.js" doctor
    displayName: 'aidev doctor'
    continueOnError: true
    env:
      AIDEV_NO_UPDATE_CHECK: '1'

  # The gate. Exit codes are the contract:
  #   0 ok · 2 tool config drift · 3 policy · 4 Wiki missing or broken
  - script: |
      set -euo pipefail
      node "$(Pipeline.Workspace)/ai-dev-kit/cli/bin/aidev.js" check
    displayName: 'aidev check (required)'
    env:
      AIDEV_NO_UPDATE_CHECK: '1'

  - script: |
      set -euo pipefail
      node "$(Pipeline.Workspace)/ai-dev-kit/cli/bin/aidev.js" check --json > "$(Build.ArtifactStagingDirectory)/aidev-check.json" || true
    displayName: 'Capture check report'
    condition: always()
    env:
      AIDEV_NO_UPDATE_CHECK: '1'

  - publish: $(Build.ArtifactStagingDirectory)
    artifact: aidev-check
    displayName: 'Publish check report'
    condition: always()
