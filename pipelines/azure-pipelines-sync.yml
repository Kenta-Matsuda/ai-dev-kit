# ai-dev-kit — scheduled Wiki sync.
#
# The SessionStart warning and the PreToolUse guard only make a human notice
# that the Wiki fell behind. Nothing converges unless something runs
# `aidev sync` on a clock — a package where everyone ignores the warning stays
# stale forever without this pipeline.
#
# Bot permissions, deliberately minimal:
#   - push branches named ai/wiki-* on this package
#   - create pull requests on this package
# NOT push to the default branch. This pipeline opens a PR; a human merges it.
#
# With --no-agent the run only advances the structured part of the Wiki
# (inventory/manifest) and leaves prose pending; the PR says so. Drop
# --no-agent once the pipeline has Claude Code, credentials and a token budget.

trigger: none          # never on push: this is a clock, not a reaction
pr: none

schedules:
  - cron: "0 18 * * *"           # daily, 18:00 UTC
    displayName: 'Nightly Wiki sync'
    branches:
      include: [main]
    always: true                 # run even when the package had no commits

pool:
  vmImage: ubuntu-latest

variables:
  - name: NODE_VERSION
    value: '20.x'
  - name: AIDEV_KIT_URL
    value: 'https://dev.azure.com/<org>/<project>/_git/ai-dev-kit'
  - name: AIDEV_KIT_REF
    value: 'main'

steps:
  - checkout: self
    fetchDepth: 0
    # The bot's token must reach `git push` for the ai/wiki-* branch.
    persistCredentials: true

  - task: NodeTool@0
    displayName: 'Use Node $(NODE_VERSION)'
    inputs:
      versionSpec: $(NODE_VERSION)

  - script: |
      set -euo pipefail
      git clone --quiet --depth 1 --branch "$(AIDEV_KIT_REF)" "$(AIDEV_KIT_URL)" "$(Pipeline.Workspace)/ai-dev-kit"
      node "$(Pipeline.Workspace)/ai-dev-kit/cli/bin/aidev.js" --version
    displayName: 'Get ai-dev-kit'

  - script: |
      set -euo pipefail
      git config user.email "$(AIDEV_BOT_EMAIL)"
      git config user.name  "$(AIDEV_BOT_NAME)"
    displayName: 'Configure bot identity'
    env:
      AIDEV_BOT_EMAIL: $(AIDEV_BOT_EMAIL)
      AIDEV_BOT_NAME: $(AIDEV_BOT_NAME)

  - script: |
      set -euo pipefail
      node "$(Pipeline.Workspace)/ai-dev-kit/cli/bin/aidev.js" status --no-remote || true
    displayName: 'Report state'
    env:
      AIDEV_NO_UPDATE_CHECK: '1'

  # `aidev sync` resolves the target itself by fetching the tracking branch. It
  # is a no-op when the Wiki committed on the branch already describes it, and
  # it updates an existing open sync PR instead of opening a second one.
  - script: |
      set -euo pipefail
      node "$(Pipeline.Workspace)/ai-dev-kit/cli/bin/aidev.js" sync --no-agent
    displayName: 'aidev sync'
    env:
      AIDEV_NO_UPDATE_CHECK: '1'
      AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)

  # Advance any issue-to-pr task whose PKG PR a human merged since the last run.
  - script: |
      set -euo pipefail
      node "$(Pipeline.Workspace)/ai-dev-kit/cli/bin/aidev.js" task advance
    displayName: 'aidev task advance'
    condition: succeededOrFailed()
    env:
      AIDEV_NO_UPDATE_CHECK: '1'
      AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
